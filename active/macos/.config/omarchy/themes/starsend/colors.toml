# Starsend — one signal against the dark
# Maximum contrast. Near-black ground, muted chromatics, a single saturated amber.

mode                     = "dark"

# Signal, selection and the de-emphasised ramp
accent                   = "#f0913f"
selection                = "#1c2f33"
muted                    = "#617877"

# Ground, from the deepest surface up to the elevated one
background               = "#05090a"
dark_background          = "#030607"
darker_background        = "#010304"
lighter_background       = "#0e1719"

# Text, from de-emphasised up to the cursor
foreground               = "#c3d2d0"
dark_foreground          = "#5d7271"
light_foreground         = "#d8e4e1"
bright_foreground        = "#f4faf8"

# Window borders. Also drives the shell's border tokens.
hyprland_active_border   = "rgba(f0913fee) rgba(f0913f55) 45deg"
hyprland_inactive_border = "rgba(1c2f33aa)"

# Named colours
red                      = "#d2705c"
yellow                   = "#c9a878"
orange                   = "#f0913f"
green                    = "#86a68f"
cyan                     = "#7ba6a3"
blue                     = "#8299aa"
magenta                  = "#b58c99"
brown                    = "#8d6144"

# Bright variants
bright_red               = "#e88a75"
bright_yellow            = "#dcc294"
bright_green             = "#a1c0aa"
bright_cyan              = "#96c1be"
bright_blue              = "#9db4c4"
bright_magenta           = "#cda6b2"
